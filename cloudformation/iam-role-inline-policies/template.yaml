AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parameterized IAM Roles - Common AWS Use Cases'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Role Configuration"
        Parameters:
          - ProjectName
          - RoleType
          - RoleName
          - Environment
          - AssumeRolePrincipal
      - Label:
          default: "Data Pipeline Permissions"
        Parameters:
          - EnableS3Policy
          - EnableS3WritePolicy
          - EnableS3ReadWritePolicy
          - EnableKinesisPolicy
          - EnableDynamoDBPolicy
          - EnableGluePolicy
          - EnableAthenaPolicy
      - Label:
          default: "Compute & Orchestration Permissions"
        Parameters:
          - EnableLambdaPolicy
          - EnableStepFunctionsPolicy
          - EnableECSPolicy
          - EnableCodeBuildPolicy
      - Label:
          default: "Integration & Messaging"
        Parameters:
          - EnableSQSPolicy
          - EnableSNSPolicy
          - EnableEventBridgePolicy
          - EnableAPIGatewayPolicy
      - Label:
          default: "Security & Observability"
        Parameters:
          - EnableSecretsManagerPolicy
          - EnableCloudWatchPolicy
          - EnableXRayPolicy
          - EnableCloudTrailPolicy
      - Label:
          default: "Cross-Account & Advanced"
        Parameters:
          - EnableCrossAccountAccess
          - CrossAccountId
          - EnableKMSPolicy
          - EnableTagging

Parameters:
  ProjectName:
    Type: String
    Default: 'cfn-nested'
    AllowedPattern: '^[a-zA-Z0-9-]{1,64}$'
    Description: Project name used as prefix for role naming

  RoleType:
    Type: String
    Default: 'DataPipeline'
    AllowedValues:
      - DataPipeline
      - LambdaFunction
      - EC2Instance
      - ECSTask
      - StepFunctions
      - DataScience
      - APIBackend
      - EventProcessor
      - Custom
    Description: Predefined role type with common permission sets

  RoleName:
    Type: String
    Default: 'iam-role'
    AllowedPattern: '^[a-zA-Z0-9-]{1,64}$'
    Description: Name of the IAM role

  Environment:
    Type: String
    Default: devl
    AllowedValues:
      - devl
      - test
      - prod
    Description: Environment for tagging and resource filtering

  AssumeRolePrincipal:
    Type: String
    Default: lambda.amazonaws.com
    AllowedValues:
      - lambda.amazonaws.com
      - ec2.amazonaws.com
      - ecs-tasks.amazonaws.com
      - states.amazonaws.com
      - glue.amazonaws.com
      - codebuild.amazonaws.com
      - ssm.amazonaws.com
      - events.amazonaws.com
      - datapipeline.amazonaws.com
    Description: AWS service that can assume this role

  # Data Pipeline Policies
  EnableS3Policy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: S3 read-only access for data lakes

  EnableS3WritePolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: S3 write-only access for data lakes

  EnableS3ReadWritePolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: S3 read-write access for data lakes

  EnableKinesisPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Kinesis data streams access (for real-time pipelines)

  EnableDynamoDBPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: DynamoDB CRUD operations

  EnableGluePolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: AWS Glue ETL job execution

  EnableAthenaPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Athena query execution and result storage

  # Compute & Orchestration
  EnableLambdaPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Lambda function invocation

  EnableStepFunctionsPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Step Functions state machine execution

  EnableECSPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: ECS task management

  EnableCodeBuildPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: CodeBuild project execution

  # Integration & Messaging
  EnableSQSPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: SQS queue operations

  EnableSNSPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: SNS topic publish

  EnableEventBridgePolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: EventBridge rule and event target management

  EnableAPIGatewayPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: API Gateway invocation logging

  # Security & Observability
  EnableSecretsManagerPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Secrets Manager secret retrieval

  EnableCloudWatchPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: CloudWatch Logs and metrics

  EnableXRayPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: AWS X-Ray tracing

  EnableCloudTrailPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: CloudTrail log access

  # Cross-Account & Advanced
  EnableCrossAccountAccess:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable cross-account access

  CrossAccountId:
    Type: String
    Default: ''
    Description: Cross-account ID (required if EnableCrossAccountAccess is true)

  EnableKMSPolicy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: KMS key operations for encryption

  EnableTagging:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Allow tagging of resources

  S3BucketArn:
    Type: String
    Default: 'arn:aws:s3:::test-bucket-us-east-1'
    Description: S3 bucket ARN(s) for policy (e.g., 'arn:aws:s3:::my-bucket' or 'arn:aws:s3:::my-bucket/*')

  KinesisStreamArn:
    Type: String
    Default: 'arn:aws:kinesis:*:*:stream/*'
    Description: Kinesis stream ARN pattern

  DynamoDBTableArn:
    Type: String
    Default: 'arn:aws:dynamodb:*:*:table/*'
    Description: DynamoDB table ARN pattern

  GlueJobArn:
    Type: String
    Default: 'arn:aws:glue:*:*:job/*'
    Description: Glue job ARN pattern

  GlueCatalogArn:
    Type: String
    Default: 'arn:aws:glue:*:*:catalog'
    Description: Glue catalog ARN

  GlueDatabaseArn:
    Type: String
    Default: 'arn:aws:glue:*:*:database/*'
    Description: Glue database ARN pattern

  GlueTableArn:
    Type: String
    Default: 'arn:aws:glue:*:*:table/*/*'
    Description: Glue table ARN pattern

  AthenaWorkgroupArn:
    Type: String
    Default: 'arn:aws:athena:*:*:workgroup/*'
    Description: Athena workgroup ARN pattern

  AthenaQueryResultsArn:
    Type: String
    Default: 'arn:aws:s3:::aws-athena-query-results-*/*'
    Description: S3 bucket ARN for Athena query results

  LambdaFunctionArn:
    Type: String
    Default: 'arn:aws:lambda:*:*:function/*'
    Description: Lambda function ARN pattern

  StepFunctionsStateMachineArn:
    Type: String
    Default: 'arn:aws:states:*:*:stateMachine:*'
    Description: Step Functions state machine ARN pattern

  StepFunctionsExecutionArn:
    Type: String
    Default: 'arn:aws:states:*:*:execution:*/*'
    Description: Step Functions execution ARN pattern

  ECSTaskArn:
    Type: String
    Default: 'arn:aws:ecs:*:*:task/*'
    Description: ECS task ARN pattern

  ECSTaskDefinitionArn:
    Type: String
    Default: 'arn:aws:ecs:*:*:task-definition/*'
    Description: ECS task definition ARN pattern

  IAMRoleArn:
    Type: String
    Default: 'arn:aws:iam::*:role/*'
    Description: IAM role ARN pattern

  CodeBuildProjectArn:
    Type: String
    Default: 'arn:aws:codebuild:*:*:project/*'
    Description: CodeBuild project ARN pattern

  SQSQueueArn:
    Type: String
    Default: 'arn:aws:sqs:*:*:*'
    Description: SQS queue ARN pattern

  SNSTopicArn:
    Type: String
    Default: 'arn:aws:sns:*:*:*'
    Description: SNS topic ARN pattern

  EventBridgeArn:
    Type: String
    Default: 'arn:aws:events:*:*:event-bus/default'
    Description: EventBridge event bus ARN

  SecretsManagerArn:
    Type: String
    Default: 'arn:aws:secretsmanager:*:*:secret:*'
    Description: Secrets Manager secret ARN pattern

  CloudWatchLogsArn:
    Type: String
    Default: 'arn:aws:logs:*:*:log-group:*'
    Description: CloudWatch Logs ARN pattern

  KMSKeyArn:
    Type: String
    Default: 'arn:aws:kms:*:*:key/*'
    Description: KMS key ARN pattern

  CrossAccountRoleArn:
    Type: String
    Default: 'arn:aws:iam::*:role/*'
    AllowedPattern: '^(arn:.+|\\*)$'
    Description: Cross-account IAM role ARN pattern (required if EnableCrossAccountAccess is true)

Conditions:
  # Data Pipeline
  CreateS3Policy: !Equals [!Ref EnableS3Policy, 'true']
  CreateS3WritePolicy: !Equals [!Ref EnableS3WritePolicy, 'true']
  CreateS3ReadWritePolicy: !Equals [!Ref EnableS3ReadWritePolicy, 'true']
  CreateKinesisPolicy: !Equals [!Ref EnableKinesisPolicy, 'true']
  CreateDynamoDBPolicy: !Equals [!Ref EnableDynamoDBPolicy, 'true']
  CreateGluePolicy: !Equals [!Ref EnableGluePolicy, 'true']
  CreateAthenaPolicy: !Equals [!Ref EnableAthenaPolicy, 'true']

  # Compute & Orchestration
  CreateLambdaPolicy: !Equals [!Ref EnableLambdaPolicy, 'true']
  CreateStepFunctionsPolicy: !Equals [!Ref EnableStepFunctionsPolicy, 'true']
  CreateECSPolicy: !Equals [!Ref EnableECSPolicy, 'true']
  CreateCodeBuildPolicy: !Equals [!Ref EnableCodeBuildPolicy, 'true']

  # Integration & Messaging
  CreateSQSPolicy: !Equals [!Ref EnableSQSPolicy, 'true']
  CreateSNSPolicy: !Equals [!Ref EnableSNSPolicy, 'true']
  CreateEventBridgePolicy: !Equals [!Ref EnableEventBridgePolicy, 'true']
  CreateAPIGatewayPolicy: !Equals [!Ref EnableAPIGatewayPolicy, 'true']

  # Security & Observability
  CreateSecretsManagerPolicy: !Equals [!Ref EnableSecretsManagerPolicy, 'true']
  CreateCloudWatchPolicy: !Equals [!Ref EnableCloudWatchPolicy, 'true']
  CreateXRayPolicy: !Equals [!Ref EnableXRayPolicy, 'true']
  CreateCloudTrailPolicy: !Equals [!Ref EnableCloudTrailPolicy, 'true']

  # Cross-Account & Advanced
  CreateCrossAccountAccess: !And
    - !Equals [!Ref EnableCrossAccountAccess, 'true']
    - !Not [!Equals [!Ref CrossAccountId, '']]
  CreateKMSPolicy: !Equals [!Ref EnableKMSPolicy, 'true']
  CreateTaggingPolicy: !Equals [!Ref EnableTagging, 'true']

Resources:
  IAMRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides parameterized IAM role with conditional inline policies for common AWS use cases including data pipelines, compute, orchestration, messaging, security, and observability
        trust:
          src: authored
          conf: high
        must:
          - Supports multiple predefined role types with configurable permission sets
          - Enables fine-grained policy control via enable/disable parameters
          - Provides environment-based naming and tagging for resource organization
    Properties:
      RoleName: !Sub '${ProjectName}-${RoleName}-${Environment}-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Ref AssumeRolePrincipal
            Action: sts:AssumeRole
      Description: !Sub 'Role for ${RoleType} in ${Environment} environment'
      MaxSessionDuration: 3600
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: RoleType
          Value: !Ref RoleType
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: IAMRoles
      Policies:
        # ============= DATA PIPELINE POLICIES =============
        - !If
          - CreateS3Policy
          - PolicyName: S3ReadOnlyPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: S3BucketOperations
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                    - s3:GetBucketLocation
                    - s3:ListBucketVersions
                    - s3:GetObjectVersion
                  Resource:
                    - !Ref S3BucketArn
                - Sid: S3ListAllBuckets
                  Effect: Allow
                  Action:
                    - s3:ListAllMyBuckets
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - CreateS3WritePolicy
          - PolicyName: S3WritePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: S3WriteOperations
                  Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:PutObjectVersionTagging
                    - s3:DeleteObjectVersion
                  Resource:
                    - !Ref S3BucketArn
                - Sid: S3ListBucket
                  Effect: Allow
                  Action:
                    - s3:ListBucket
                    - s3:GetBucketLocation
                    - s3:ListBucketVersions
                  Resource:
                    - !Ref S3BucketArn
          - !Ref AWS::NoValue

        - !If
          - CreateS3ReadWritePolicy
          - PolicyName: S3ReadWritePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: S3ReadWriteOperations
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                    - s3:GetBucketLocation
                    - s3:ListBucketVersions
                    - s3:GetObjectVersion
                    - s3:PutObjectVersionTagging
                    - s3:DeleteObjectVersion
                  Resource:
                    - !Ref S3BucketArn
                - Sid: S3ListAllBuckets
                  Effect: Allow
                  Action:
                    - s3:ListAllMyBuckets
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - CreateKinesisPolicy
          - PolicyName: KinesisStreamPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kinesis:PutRecord
                    - kinesis:PutRecords
                    - kinesis:GetRecords
                    - kinesis:GetShardIterator
                    - kinesis:DescribeStream
                    - kinesis:ListStreams
                    - kinesis:ListShards
                  Resource: !Ref KinesisStreamArn
          - !Ref AWS::NoValue

        - !If
          - CreateDynamoDBPolicy
          - PolicyName: DynamoDBPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:BatchGetItem
                    - dynamodb:BatchWriteItem
                  Resource:
                    - !Ref DynamoDBTableArn
                - Effect: Allow
                  Action:
                    - dynamodb:ListTables
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - CreateGluePolicy
          - PolicyName: GlueETLPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - glue:StartJobRun
                    - glue:GetJobRun
                    - glue:GetJobRuns
                    - glue:GetJob
                  Resource:
                    - !Ref GlueJobArn
                - Effect: Allow
                  Action:
                    - glue:GetDatabase
                    - glue:GetTable
                    - glue:GetPartitions
                  Resource:
                    - !Ref GlueCatalogArn
                    - !Ref GlueDatabaseArn
                    - !Ref GlueTableArn
          - !Ref AWS::NoValue

        - !If
          - CreateAthenaPolicy
          - PolicyName: AthenaQueryPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - athena:StartQueryExecution
                    - athena:GetQueryExecution
                    - athena:GetQueryResults
                    - athena:StopQueryExecution
                  Resource:
                    - !Ref AthenaWorkgroupArn
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !Ref AthenaQueryResultsArn
          - !Ref AWS::NoValue

        # ============= COMPUTE & ORCHESTRATION POLICIES =============
        - !If
          - CreateLambdaPolicy
          - PolicyName: LambdaInvocationPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                    - lambda:InvokeAsync
                  Resource: !Ref LambdaFunctionArn
          - !Ref AWS::NoValue

        - !If
          - CreateStepFunctionsPolicy
          - PolicyName: StepFunctionsPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - states:StartExecution
                    - states:DescribeExecution
                    - states:DescribeStateMachine
                    - states:StopExecution
                  Resource:
                    - !Ref StepFunctionsStateMachineArn
                    - !Ref StepFunctionsExecutionArn
          - !Ref AWS::NoValue

        - !If
          - CreateECSPolicy
          - PolicyName: ECSTaskPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ecs:RunTask
                    - ecs:DescribeTasks
                    - ecs:StopTask
                  Resource:
                    - !Ref ECSTaskArn
                    - !Ref ECSTaskDefinitionArn
                - Effect: Allow
                  Action:
                    - iam:PassRole
                  Resource:
                    - !Ref IAMRoleArn
          - !Ref AWS::NoValue

        - !If
          - CreateCodeBuildPolicy
          - PolicyName: CodeBuildPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - codebuild:BatchGetBuilds
                    - codebuild:StartBuild
                  Resource: !Ref CodeBuildProjectArn
          - !Ref AWS::NoValue

        # ============= INTEGRATION & MESSAGING POLICIES =============
        - !If
          - CreateSQSPolicy
          - PolicyName: SQSPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ChangeMessageVisibility
                    - sqs:GetQueueUrl
                  Resource: !Ref SQSQueueArn
          - !Ref AWS::NoValue

        - !If
          - CreateSNSPolicy
          - PolicyName: SNSPublishPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref SNSTopicArn
          - !Ref AWS::NoValue

        - !If
          - CreateEventBridgePolicy
          - PolicyName: EventBridgePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - events:PutEvents
                  Resource: !Ref EventBridgeArn
          - !Ref AWS::NoValue

        - !If
          - CreateAPIGatewayPolicy
          - PolicyName: APIGatewayLogsPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogDelivery
                    - logs:GetLogDelivery
                    - logs:UpdateLogDelivery
                    - logs:DeleteLogDelivery
                    - logs:ListLogDeliveries
                  Resource: '*'
          - !Ref AWS::NoValue

        # ============= SECURITY & OBSERVABILITY POLICIES =============
        - !If
          - CreateSecretsManagerPolicy
          - PolicyName: SecretsManagerPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource: !Ref SecretsManagerArn
          - !Ref AWS::NoValue

        - !If
          - CreateCloudWatchPolicy
          - PolicyName: CloudWatchLogsPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                    - logs:DescribeLogStreams
                    - logs:GetLogEvents
                    - logs:FilterLogEvents
                  Resource: !Ref CloudWatchLogsArn
                - Effect: Allow
                  Action:
                    - cloudwatch:PutMetricData
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - CreateXRayPolicy
          - PolicyName: XRayWritePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - xray:PutTraceSegments
                    - xray:PutTelemetryRecords
                  Resource: '*'
          - !Ref AWS::NoValue

        - !If
          - CreateCloudTrailPolicy
          - PolicyName: CloudTrailReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - cloudtrail:LookupEvents
                  Resource: '*'
          - !Ref AWS::NoValue

        # ============= CROSS-ACCOUNT & ADVANCED POLICIES =============
        - !If
          - CreateCrossAccountAccess
          - PolicyName: CrossAccountAssumePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource: !Ref CrossAccountRoleArn
          - !Ref AWS::NoValue

        - !If
          - CreateKMSPolicy
          - PolicyName: KMSPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:DescribeKey
                    - kms:GenerateDataKey
                  Resource: !Ref KMSKeyArn
          - !Ref AWS::NoValue

        - !If
          - CreateTaggingPolicy
          - PolicyName: TaggingPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - tag:TagResources
                    - tag:UntagResources
                    - tag:GetResources
                  Resource: '*'
          - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: ARN of the created IAM role
    Value: !GetAtt IAMRole.Arn
    Export:
      Name: !Sub '${Environment}-${RoleName}-Arn'

  RoleName:
    Description: Name of the created IAM role
    Value: !Ref IAMRole
    Export:
      Name: !Sub '${Environment}-${RoleName}-Name'

  AssumeRoleCommand:
    Description: AWS CLI command to assume this role
    Value: !Sub |
      aws sts assume-role \
        --role-arn ${IAMRole.Arn} \
        --role-session-name iam-session

  CloudFormationStackId:
    Description: CloudFormation stack ID
    Value: !Ref AWS::StackId

  DeploymentInfo:
    Description: Deployment summary
    Value: !Sub |
      Role: ${IAMRole}
      Type: ${RoleType}
      Environment: ${Environment}
      Principal: ${AssumeRolePrincipal}
